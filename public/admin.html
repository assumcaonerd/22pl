<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel editorial | Rádio 22PL</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body><header><a class="brand" href="/"><b>22</b><span>PL</span><em>RÁDIO</em></a><nav><a href="/">Voltar à rádio</a></nav></header><main class="admin"><section><small>CONTROLE DA REDAÇÃO</small><h1>Painel editorial</h1><p>Aprove, bloqueie ou transforme uma pauta em plantão.</p></section><div class="admin-grid"><form data-form><h2>Nova notícia</h2><label>Título<input name="title" required></label><label>Resumo<textarea name="summary" required></textarea></label><div class="two"><label>Editoria<input name="category" required></label><label>Fonte<input name="source" required></label></div><label>Link da fonte<input name="sourceUrl" type="url"></label><div class="two"><label>Status<select name="status"><option value="pending">Pendente</option><option value="approved">Aprovada</option><option value="blocked">Bloqueada</option></select></label><label>Prioridade<input name="priority" type="number" min="0" max="100" value="50"></label></div><label class="check"><input name="breaking" type="checkbox"> Marcar como plantão</label><button>Salvar notícia</button><p data-message></p></form><section><h2>Fila editorial</h2><div data-editorial></div></section></div></main><script src="admin.js"></script></body></html>
